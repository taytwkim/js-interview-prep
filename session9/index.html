<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reply Library</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">SUPPORT OPERATIONS</p><h1>Reply Library</h1><p>Maintain reusable replies for your team.</p></div><button id="new-template" type="button">New template</button></header>
    
    <div class="workspace">
      <section class="panel" aria-label="Template library">
        
        <div class="filters"><label>Search<input id="search" type="search" placeholder="Title or reply text"></label><label>Category<select id="category-filter"><option value="all">All categories</option><option value="General">General</option><option value="Shipping">Shipping</option><option value="Billing">Billing</option></select></label></div>
        <p class="counts"><strong id="visible-count">0</strong> visible · <strong id="total-count">0</strong> total templates</p>
        
        <div id="template-list"></div>
        <p id="empty-message" hidden>No templates match your filters.</p>
        <p id="message" role="status"></p>
      </section>

      <aside class="panel" aria-label="Template editor">
        <p id="editor-placeholder">Choose Edit or New template to get started.</p>
        
        <form id="template-form" hidden novalidate>
          <h2 id="editor-heading">Template</h2>
          <label for="edit-title">Title</label><input id="edit-title" type="text" required>
          <label for="edit-category">Category</label><select id="edit-category"><option value="General">General</option><option value="Shipping">Shipping</option><option value="Billing">Billing</option></select>
          <label for="edit-body">Reply text</label><textarea id="edit-body" rows="6" required></textarea>
          <p id="editor-error" role="alert"></p>
          <div class="actions"><button type="submit">Save</button><button id="cancel" class="secondary" type="button">Cancel</button></div>
        </form>
      </aside>
    </div>
    <footer>Practice library · No messages are sent · Refresh resets data</footer>
  </main>
</body>
</html>
